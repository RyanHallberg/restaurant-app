name: CI

# PRs only: pushes to main run the Deploy workflow, which gates on the same tests.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers integration tests use the runner's Docker daemon.
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the full stack
        run: docker compose --profile full up -d --build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for the stack
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081 >/dev/null && curl -sf http://localhost:8080/actuator/health >/dev/null && exit 0
            sleep 2
          done
          echo "stack never became healthy"
          docker compose ps
          docker compose logs
          exit 1
      - run: npm run e2e
        working-directory: frontend
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
