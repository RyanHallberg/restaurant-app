# Throwaway: proves the Workload Identity Federation plumbing before the real
# deploy workflow depends on it. Deleted once the deploy pipeline is live.
name: WIF test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud auth list
          gcloud run services describe restaurant-api --region "${{ vars.GCP_REGION }}" --format='value(status.url)'
