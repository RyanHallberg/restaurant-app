spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant
    username: restaurant
    password: restaurant
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173 # Vite dev server
      # Compose full-stack profile (nginx). Same-origin POSTs still carry an
      # Origin header, so the CORS filter must know this one too.
      - http://localhost:8081
