spring:
  datasource:
    # Cloud SQL Java Connector: no IP allowlisting, TLS handled by the
    # connector, IAM enforced via the runtime service account's
    # roles/cloudsql.client. Mandatory pattern for Java per Google docs.
    url: jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    # Secret Manager volume mounts: PEMs as files, never through env vars
    # (newlines get mangled). Each secret needs its own directory — Cloud Run
    # rejects two different secrets mounted into the same folder.
    public-key: file:/secrets/jwt-public/key.pem
    private-key: file:/secrets/jwt-private/key.pem
