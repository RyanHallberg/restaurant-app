spring:
  application:
    name: restaurant-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Batch lazy collection loads (e.g. order items on paged order lists)
        # instead of one SELECT per parent row.
        default_batch_fetch_size: 20
  flyway:
    # Prod runs only real migrations. The local profile adds db/seed (dev admin).
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # The restaurant's business timezone. All "is this slot in the past" logic
  # runs on this zone, never the JVM default (UTC in containers).
  timezone: America/Chicago
  jwt:
    # Dev-only keypair, committed on purpose; prod overrides these with
    # Secret Manager volume mounts (see application-prod.yaml).
    public-key: classpath:certs/jwt-dev-public.pem
    private-key: classpath:certs/jwt-dev-private.pem
  reservations:
    tables-per-slot: 10
    slot-minutes: 30
    opening-time: "11:00"
    closing-time: "22:00"
