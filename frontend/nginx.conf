server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes must serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
